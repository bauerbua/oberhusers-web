name: Deploy to HOSTFACTORY

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check required secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Repository-Secret $name fehlt (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --working-dir=backend --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Astro
        run: npm run build

      # Hostfactorys open_basedir erlaubt PHP nur httpdocs + /tmp. Deshalb
      # müssen vendor/ und config.php innerhalb von httpdocs liegen.
      - name: Bundle PHP dependencies into the build
        run: |
          rm -rf dist/api/private/vendor
          mkdir -p dist/api/private
          cp -R backend/vendor dist/api/private/vendor
          cp public/api/private/.htaccess dist/api/private/.htaccess

      - name: Verify build
        run: |
          test -f dist/api/forms.php
          test -f dist/api/altcha-challenge.php
          test -f dist/api/private/vendor/autoload.php
          test -f dist/api/private/.htaccess

      # `api/private/config.php` wird bewusst nicht deployt: Die Datei wird
      # manuell per FTPS gepflegt und darf vom Abgleich nicht angefasst werden.
      - name: Deploy website
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: httpdocs/
          state-name: .ftp-deploy-site.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/api/private/config.php
            api/private/config.php
          log-level: verbose

      - name: Smoke test ALTCHA endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.oberhusers.ch' }}
        run: |
          url="$SITE_URL/api/altcha-challenge.php"
          for attempt in 1 2 3 4 5; do
            response="$(curl -sS --max-time 10 -w '\n%{http_code}' "$url" || true)"
            code="$(printf '%s' "$response" | tail -n 1)"
            body="$(printf '%s' "$response" | sed '$d')"

            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"signature"'; then
              echo "ALTCHA endpoint antwortet korrekt."
              exit 0
            fi

            echo "Versuch $attempt fehlgeschlagen (HTTP $code): ${body:0:300}"
            sleep 5
          done
          echo "::error::ALTCHA-Endpoint antwortet nicht wie erwartet. Prüfe httpdocs/api/private/config.php und httpdocs/api/private/vendor/ auf dem Server."
          exit 1
